<template>
    <lightning-card title="Create Account & Contact" icon-name="standard:contact">
        <div class="slds-p-around_medium">
            <lightning-input label="Account Name" value={accountName} onchange={handleChange} data-field="accountName"></lightning-input>
            <lightning-input label="Contact Name" value={contactName} onchange={handleChange} data-field="contactName"></lightning-input>
            <lightning-input type="email" label="Email" value={email} onchange={handleChange} data-field="email"></lightning-input>
            <lightning-input label="Zip / Postal Code" value={zipCode} onchange={handleChange} onblur={handleZipBlur} data-field="zipCode"></lightning-input>

            <lightning-input label="City" value={city} readonly></lightning-input>
            <lightning-input label="State" value={state} readonly></lightning-input>

            <template if:true={errorMessage}>
                <p class="slds-text-color_error">{errorMessage}</p>
            </template>

            <lightning-button label="Submit" variant="brand" onclick={handleSubmit} class="slds-m-top_medium"></lightning-button>
        </div>
    </lightning-card>
</template>

<template>

    <lightning-card>

        <!-- =====================================================
             HEADER
        ====================================================== -->

        <div class="header-container">

            <div class="header-left">

                <lightning-icon
                    icon-name="standard:case"
                    size="small"
                    alternative-text="Cases">
                </lightning-icon>

                <div class="header-title">

                    <h2>
                        Related Cases
                    </h2>

                    <template if:true={totalRecords}>
                        <span class="record-count">
                            {totalRecords} Records
                        </span>
                    </template>

                </div>

            </div>

            <div class="header-right">

                <lightning-button
                    label="New Case"
                    variant="brand"
                    icon-name="utility:add"
                    onclick={openNewCaseModal}>
                </lightning-button>

            </div>

        </div>


        <!-- =====================================================
             FILTER SECTION
        ====================================================== -->

        <div class="filter-container">

            <!-- SEARCH -->

            <div class="search-container">

                <lightning-input
                    type="search"
                    label="Search Cases"
                    placeholder="Search by Case Number or Subject..."
                    value={searchKey}
                    onchange={handleSearch}
                    variant="label-hidden">
                </lightning-input>

            </div>


            <!-- STATUS -->

            <div class="filter-item">

                <lightning-combobox
                    name="statusFilter"
                    label="Status"
                    value={status}
                    options={statusOptions}
                    onchange={handleStatusChange}>
                </lightning-combobox>

            </div>


            <!-- PRIORITY -->

            <div class="filter-item">

                <lightning-combobox
                    name="priorityFilter"
                    label="Priority"
                    value={priority}
                    options={priorityOptions}
                    onchange={handlePriorityChange}>
                </lightning-combobox>

            </div>


            <!-- CLEAR -->

            <div class="clear-filter">

                <lightning-button
                    label="Clear"
                    icon-name="utility:refresh"
                    onclick={clearFilters}>
                </lightning-button>

            </div>

        </div>


        <!-- =====================================================
             TABLE
        ====================================================== -->

        <div class="table-container">

            <lightning-datatable
                key-field="Id"
                data={cases}
                columns={columns}
                draft-values={draftValues}
                onsave={handleSave}
                hide-checkbox-column
                resize-column-disabled>
            </lightning-datatable>


            <!-- NO RECORDS -->

            <template if:true={showNoRecords}>

                <div class="no-records">

                    <lightning-icon
                        icon-name="utility:search"
                        size="small"
                        alternative-text="No Records">
                    </lightning-icon>

                    <p>
                        No Cases found.
                    </p>

                </div>

            </template>

        </div>


        <!-- =====================================================
             PAGINATION
        ====================================================== -->

        <div class="pagination-container">
            <div class="pagination-info">
                <span>Total Records:<strong>{totalRecords}</strong></span>
            </div>
            <div class="pagination-controls">
                <lightning-button label="Previous" icon-name="utility:chevronleft" onclick={handlePrevious} disabled={disablePrevious}></lightning-button>
                <span class="page-info">Page<strong>{currentPage}</strong>of<strong>{totalPages}</strong></span>
                <lightning-button label="Next" icon-position="right" onclick={handleNext} disabled={disableNext}></lightning-button>
            </div>
        </div>


        <!-- =====================================================
             LOADING
        ====================================================== -->

        <template if:true={isLoading}>

            <div class="spinner-container">

                <lightning-spinner
                    alternative-text="Loading Cases..."
                    size="medium">
                </lightning-spinner>

            </div>

        </template>

    </lightning-card>


    <!-- =========================================================
         NEW CASE MODAL
    ========================================================== -->

    <template if:true={showModal}>

        <section
            role="dialog"
            tabindex="-1"
            aria-modal="true"
            aria-labelledby="new-case-heading"
            class="slds-modal slds-fade-in-open">

            <div class="slds-modal__container">


                <!-- =================================================
                     MODAL HEADER
                ================================================== -->
                <header class="slds-modal__header">
                    <h2
                        id="new-case-heading"
                        class="slds-text-heading_medium">
                        New Case
                    </h2>

                </header>


                <!-- =================================================
                     MODAL BODY
                ================================================== -->

                <div class="slds-modal__content slds-p-around_medium">


                    <!-- SUBJECT -->

                    <lightning-input
                        name="subject"
                        label="Subject"
                        value={newCase.subject}
                        onchange={handleNewCaseChange}
                        required
                        message-when-value-missing="Case Subject is required.">

                    </lightning-input>


                    <!-- DESCRIPTION -->

                    <lightning-textarea
                        name="description"
                        label="Description"
                        value={newCase.description}
                        onchange={handleNewCaseChange}>

                    </lightning-textarea>


                    <!-- PRIORITY -->

                    <lightning-combobox
                        name="priority"
                        label="Priority"
                        value={newCase.priority}
                        options={priorityOptionsForCreate}
                        onchange={handleNewCaseChange}>

                    </lightning-combobox>


                    <!-- ORIGIN -->

                    <lightning-combobox
                        name="origin"
                        label="Origin"
                        value={newCase.origin}
                        options={originOptions}
                        onchange={handleNewCaseChange}>

                    </lightning-combobox>


                </div>


                <!-- =================================================
                     MODAL FOOTER
                ================================================== -->

                <footer class="slds-modal__footer">

                    <lightning-button
                        label="Cancel"
                        onclick={closeModal}
                        disabled={isSaving}>

                    </lightning-button>


                    <lightning-button
                        class="slds-m-left_small"
                        variant="brand"
                        label="Save Case"
                        onclick={saveCase}
                        disabled={isSaving}>

                    </lightning-button>

                </footer>

            </div>

        </section>


        <!-- BACKDROP -->

        <div class="slds-backdrop slds-backdrop_open"></div>

    </template>

</template>

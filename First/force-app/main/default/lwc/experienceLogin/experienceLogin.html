<template>
    <lightning-card title="Login">
        <div class="slds-p-around_medium">

            <lightning-input
                type="text"
                label="Username"
                value={username}
                onchange={handleUsername}>
            </lightning-input>

            <lightning-input
                type="password"
                label="Password"
                value={password}
                onchange={handlePassword}>
            </lightning-input>

            <div class="slds-m-top_medium">
                <lightning-button
                    label="Login"
                    variant="brand"
                    onclick={login}>
                </lightning-button>
            </div>

            <template if:true={errorMessage}>
                <div class="slds-text-color_error slds-m-top_medium">
                    {errorMessage}
                </div>
            </template>

        </div>
    </lightning-card>
</template>
